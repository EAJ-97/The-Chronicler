services:
  chronicler:
    build: .
    container_name: dnd-chronicler
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - chronicler_data:/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chronicler_data:
    driver: local
